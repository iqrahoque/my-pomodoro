<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Lock — site blocked</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="frame">
    <div class="card">
      <div class="lock">🔒</div>
      <h1>STUDY LOCK</h1>
      <p class="msg">This site is blocked.</p>
      <div class="remaining" id="remaining">--:--</div>
      <p class="task" id="task-line"></p>
      <p class="cheer" id="cheer">Back to studying.</p>
      <button id="back-btn" type="button">← BACK TO STUDYING</button>
      <p class="meta" id="meta"></p>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
